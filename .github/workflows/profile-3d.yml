name: 3D contribution calendar

"on":
  push:
    paths:
      - .github/workflows/profile-3d.yml
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-calendar
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the night-view calendar
        shell: bash
        run: |
          chart=profile-3d-contrib/profile-night-view.svg
          test -s "$chart"
          git add -- "$chart"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update 3D contribution calendar'
          git pull --rebase
          git push
